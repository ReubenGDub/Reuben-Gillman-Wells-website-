<!DOCTYPE html>
<html lang="en">
<head>
  <!-- FIND: PAGE METADATA -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The music and creative work of Reuben Gillman-Wells, composer, songwriter and musician.">
  <meta name="theme-color" content="#202B36">
  <title>Reuben Gillman-Wells — Store</title>

  <!-- FIND: FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- FIND: STYLESHEET -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- FIND: NAVIGATION — Shared navigation across all pages -->
  <header class="site-header" id="top">

    <a class="wordmark" href="index.html" aria-label="Reuben Gillman-Wells home">
      Reuben Gillman-Wells<span></span>
    </a>

    <button class="menu-toggle" id="menuToggle"
      aria-label="Open navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <nav class="main-nav" id="mainNav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="gallery.html">Gallery</a>
      <a href="store.html" aria-current="page">Store</a>
      <a class="nav-contact" href="contact.html">
        Get in touch <span aria-hidden="true">↗&#xFE0E;</span>
      </a>
    </nav>

  </header>
  <main>
    <section class="works-section section-shell">
  
      <h1 class="works-title">Store</h1>

      <div class="works-filter" role="group" aria-label="Filter works">
        <button class="filter-btn is-active" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="filter-btn" type="button" data-filter="pieces" aria-pressed="false">Independent Pieces</button>
        <button class="filter-btn" type="button" data-filter="suites" aria-pressed="false">Suites</button>
      </div>
  
      <div class="works-grid">
  
        <!-- PIECE — copy this whole <a> block to add more pieces -->
        <a class="work-card" data-category="pieces" href="store/store-piece-template.html">
          <div class="work-image">
            <img src="images/coming-soon.png" alt="Are You Listening" loading="lazy">
          </div>
          <h2 class="work-name">Echo</h2>
          <p class="work-meta">2026 • SSAA choir and Piano (+ other editions)</p>
        </a>
      </div>
      <h1 class="nothing-here">Nothing to see here yet!</h1>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
